# MacDeck — Guition JC3248W535 (ESP32-S3, AXS15231B QSPI)
#
# Il firmware e' un renderer muto. Scarica UNA immagine a schermo intero dal
# Mac e ci sovrappone dodici rettangoli trasparenti che raccolgono i tocchi.
# Non conosce ne' app, ne' icone, ne' la griglia.
#
# PERCHE' UNA SOLA IMMAGINE. La prima versione aveva dodici online_image, una
# per tile, e sul dispositivo ha prodotto due guasti distinti:
#   - "Failed to create socket ... Failed to open a new connection: 32770":
#     ESP-IDF ha 10 socket, dodici download paralleli li esauriscono e le
#     ultime quattro tile non arrivavano mai;
#   - ogni widget immagine andava re-invalidato singolarmente dopo il
#     download, e lo schermo restava nero anche per le tile scaricate.
# Una immagine sola elimina entrambi per costruzione: un socket, un refresh.
#
# ORIENTAMENTO. Il pannello e' 320x480 e l'AXS15231B non supporta lo scambio
# degli assi: `transform: swap_xy` sul display viene rifiutato in validazione.
# Il landscape si ottiene con la rotazione SOFTWARE di LVGL, che ruota anche
# le coordinate del touch perche' il touchscreen e' registrato dentro LVGL.
# Lo spazio utile diventa 480x320.

substitutions:
  name: macdeck
  # IP e non il nome Bonjour: nome-del-mac.local annuncia SEI
  # indirizzi, fra cui 127.0.0.1 e tre IPv6 di loopback/link-local. Quando
  # l'ESP ne pesca uno sbagliato si collega a se stesso e resta bloccato
  # fino al timeout, bloccando il loop principale e facendo scattare il
  # watchdog. Richiede la riserva DHCP sul router per questo MAC.
  agent_host: "192.168.1.28"
  agent_port: "8765"

esphome:
  name: ${name}
  friendly_name: MacDeck
  min_version: 2026.5.0
  # Niente caricamento a tempo sul boot: 3 secondi non bastano sempre a
  # associarsi al WiFi, e in quel caso la richiesta falliva e la schermata
  # non veniva MAI disegnata. Si parte quando la rete c'e' davvero.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Lasciato attivo per comodita' di diagnosi, ma NON ci si appoggia:
      # vedi il commento su agent_host.
      CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  # In ordine di preferenza. Il deck prova la prima disponibile, quindi
  # portarlo fuori casa e' solo questione di accendere l'hotspot: si aggancia
  # da solo, e l'agent sul Mac lo ritrova via Bonjour senza toccare niente.
  # Le voci con SSID vuoto sono ignorate.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
    - ssid: !secret wifi_ssid_3
      password: !secret wifi_password_3
  # Ultima spiaggia: nessuna rete nota. Il deck alza il proprio access point
  # e il portale, ci si collega dal telefono e gli si passa una rete nuova.
  ap:
    ssid: "MacDeck Fallback"
  on_connect:
    then:
      - script.execute: fetch_layout

captive_portal:

mdns:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

json:

# ---------------------------------------------------------------- display

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: mipi_spi
    model: JC3248W535
    id: main_display
    spi_id: display_qspi
    dimensions:
      width: 320
      height: 480
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: 1
    id: backlight_out

light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Retroilluminazione"
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

i2c:
  - id: touch_bus
    sda: 4
    scl: 8

touchscreen:
  - platform: axs15231
    id: main_touch
    i2c_id: touch_bus
    display: main_display
    # Nessun risveglio al tocco da gestire: lo schermo non si spegne mai da
    # solo. Se la retroilluminazione viene spenta a comando, il tocco la
    # riaccende comunque senza far scattare il pulsante sotto.
    on_touch:
      - if:
          condition:
            lambda: 'return !id(backlight).current_values.is_on();'
          then:
            - light.turn_on: backlight
            - lvgl.resume:

# ------------------------------------------------------------------- rete

http_request:
  id: http
  # NON alzare questo valore. Il componente e' sincrono: ogni richiesta che
  # non riceve risposta blocca il loop principale per l'intero timeout, e a
  # 8 s si superava il watchdog di ESP-IDF (5 s). Il deck si riavviava, e
  # dopo qualche riavvio ESP-IDF tornava alla partizione precedente
  # buttando via l'aggiornamento appena caricato, in silenzio.
  # Succede ogni volta che il Mac non risponde: spento, o su un'altra rete.
  timeout: 3s
  verify_ssl: false

globals:
  - id: layout_version
    type: int
    restore_value: false
    initial_value: "-1"
  - id: current_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_count
    type: int
    restore_value: false
    initial_value: "1"
  - id: agent_online
    type: bool
    restore_value: false
    initial_value: "false"
  - id: fail_streak
    type: int
    restore_value: false
    initial_value: "0"
  - id: press_in_corso
    type: int
    restore_value: false
    initial_value: "0"
  - id: serve_layout
    type: bool
    restore_value: false
    initial_value: "false"
  - id: accessibilita_ok
    type: bool
    restore_value: false
    initial_value: "true"
  - id: state_keys
    type: std::array<std::string, 12>
    restore_value: false
  - id: hit_refs
    type: std::array<lv_obj_t *, 12>
    restore_value: false
  - id: giri_a_vuoto
    type: int
    restore_value: false
    initial_value: "0"
  - id: slot_in_volo
    type: int
    restore_value: false
    initial_value: "-1"

# L'indirizzo del Mac non e' piu' scritto nel firmware. Il Mac cerca il deck
# via Bonjour (lo annuncia ESPHome da solo) e scrive qui dove trovarlo; il
# valore resta in memoria permanente, quindi al riavvio si riparte da li'
# anche se il Mac e' spento. Su una rete mai vista non c'e' niente da
# configurare: basta che i due siano sulla stessa rete.
# Modificabile anche a mano, da Home Assistant o da qualsiasi client API.
text:
  - platform: template
    id: agent_host_txt
    name: "Indirizzo agent"
    optimistic: true
    restore_value: true
    initial_value: "${agent_host}"
    mode: text
    min_length: 0
    max_length: 63
    on_value:
      then:
        # Indirizzo nuovo: si riparte subito, senza aspettare il polling.
        - lambda: 'id(layout_version) = -1;'
        - script.execute: fetch_layout

online_image:
  - id: screen_img
    url: "http://${agent_host}:${agent_port}/screen/0.png"
    format: PNG
    type: RGB565
    buffer_size: 65536
    request_headers:
      X-Deck-Token: !secret deck_token
    on_download_finished:
      then:
        # Ri-assegnare src, non solo invalidare: dopo il download il
        # descrittore dell'immagine e' cambiato e LVGL deve rileggerlo.
        - lvgl.image.update:
            id: screen_obj
            src: screen_img
    on_error:
      then:
        - logger.log: "download della schermata fallito"

font:
  - file: "gfonts://Roboto"
    id: font_hdr
    size: 15
    glyphsets: [GF_Latin_Core]

# ---------------------------------------------------------------- script

script:
  - id: fetch_layout
    mode: restart
    then:
      - http_request.get:
          url: !lambda |-
            return std::string("http://") + id(agent_host_txt).state + ":${agent_port}" + "/layout?page=" +
                   to_string(id(current_page));
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("macdeck", "/layout ha risposto %d, torno alla "
                             "pagina 0", response->status_code);
                    id(current_page) = 0;
                    return;
                  }
                  lv_obj_t *hits[12] = {
                    id(hit_0), id(hit_1), id(hit_2), id(hit_3),
                    id(hit_4), id(hit_5), id(hit_6), id(hit_7),
                    id(hit_8), id(hit_9), id(hit_10), id(hit_11)};
                  bool used[12] = {false};
                  std::string screen_url;
                  bool nav = true;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    id(layout_version) = root["version"] | -1;
                    id(page_count) = root["pages"].size();
                    nav = root["nav"] | true;
                    // Autoritativa: il server puo' aver riportato l'indice
                    // dentro l'intervallo se la pagina corrente e' sparita.
                    id(current_page) = root["page"] | 0;
                    screen_url = std::string(root["screen"] | "");
                    for (JsonObject s : root["slots"].as<JsonArray>()) {
                      int i = s["i"] | -1;
                      if (i < 0 || i > 11) continue;
                      lv_obj_set_pos(hits[i], s["x"] | 0, s["y"] | 0);
                      lv_obj_set_size(hits[i], s["w"] | 0, s["h"] | 0);
                      lv_obj_clear_flag(hits[i], LV_OBJ_FLAG_HIDDEN);
                      id(state_keys)[i] = std::string(s["state"] | "");
                      used[i] = true;
                    }
                    return true;
                  });
                  for (int i = 0; i < 12; i++) {
                    if (!used[i]) {
                      lv_obj_add_flag(hits[i], LV_OBJ_FLAG_HIDDEN);
                      id(state_keys)[i] = "";
                    }
                  }
                  // Con una pagina sola le frecce non servono, e i 28 px
                  // della barra sono gia' stati dati alle tile dal Mac.
                  for (lv_obj_t *b : {id(nav_prev), id(nav_next)}) {
                    if (nav) lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
                    else     lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
                  }
                  if (!screen_url.empty()) {
                    id(screen_img)->set_url(std::string("http://") + id(agent_host_txt).state + ":${agent_port}" + screen_url);
                    id(screen_img)->update();
                  }

  - id: fetch_state
    mode: restart
    then:
      - http_request.get:
          url: !lambda 'return std::string("http://") + id(agent_host_txt).state + ":${agent_port}" + "/state";'
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  id(fail_streak) = 0;
                  id(agent_online) = true;
                  lv_obj_t *hits[12] = {
                    id(hit_0), id(hit_1), id(hit_2), id(hit_3),
                    id(hit_4), id(hit_5), id(hit_6), id(hit_7),
                    id(hit_8), id(hit_9), id(hit_10), id(hit_11)};
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    id(accessibilita_ok) = root["accessibility_ok"] | true;

                    // Bordo di accento sugli slot la cui chiave di stato e'
                    // veritiera: le aree di tocco sono trasparenti, quindi il
                    // bordo e' l'unica cosa che disegnano.
                    for (int i = 0; i < 12; i++) {
                      const std::string &key = id(state_keys)[i];
                      bool on = false;
                      if (!key.empty()) {
                        JsonVariantConst cur = root;
                        size_t start = 0;
                        while (true) {
                          size_t dot = key.find('.', start);
                          std::string part = (dot == std::string::npos)
                            ? key.substr(start) : key.substr(start, dot - start);
                          cur = cur[part];
                          if (dot == std::string::npos) break;
                          start = dot + 1;
                        }
                        on = cur.as<bool>();
                      }
                      lv_obj_set_style_border_width(hits[i], on ? 3 : 0,
                                                    LV_PART_MAIN);
                    }

                    // Il canale che serve per volume e brano trasporta anche
                    // l'invalidazione della cache: nessun push da progettare.
                    //
                    // NON si aggiorna qui id(layout_version): la versione va
                    // registrata solo quando fetch_layout e' RIUSCITO. Averla
                    // registrata prima significava che un solo fallimento
                    // (es. la pagina corrente sparita, 404) cristallizzava il
                    // display su un layout vecchio per sempre.
                    int v = root["layout_version"] | -1;
                    if (v != id(layout_version)) id(serve_layout) = true;
                    return true;
                  });
          on_error:
            then:
              - lambda: |-
                  // Cinque cicli, cioe' una decina di secondi: un'assenza
                  // vera dura, una collisione momentanea no. Un banner che
                  // lampeggia al primo intoppo insegna a ignorarlo.
                  id(fail_streak)++;
                  if (id(fail_streak) >= 5) id(agent_online) = false;
      # Fuori dal gestore di risposta: lanciare una seconda richiesta HTTP da
      # dentro il callback della prima non funziona, il componente e' occupato.
      # Con la bandiera il tentativo si ripete al ciclo dopo se fallisce,
      # quindi il deck si ripara da solo invece di restare nero per sempre.
      - if:
          condition:
            lambda: 'return id(serve_layout);'
          then:
            - lambda: 'id(serve_layout) = false;'
            - script.execute: fetch_layout
      - lambda: |-
          // L'avviso e' l'unica cosa che ruba spazio alle tile, quindi si
          // mostra solo quando c'e' davvero qualcosa da dire.
          const char *msg = nullptr;
          if (!id(agent_online))
            msg = "Mac non raggiungibile";
          else if (!id(accessibilita_ok))
            msg = "Permesso Accessibilita' mancante: le scorciatoie da "
                  "tastiera non funzioneranno";
          if (msg != nullptr) {
            lv_label_set_text(id(avviso_testo), msg);
            lv_obj_clear_flag(id(avviso), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(avviso), LV_OBJ_FLAG_HIDDEN);
          }

  - id: change_page
    mode: single
    parameters:
      delta: int
    then:
      - lambda: |-
          int n = id(page_count);
          if (n <= 0) n = 1;
          id(current_page) = ((id(current_page) + delta) % n + n) % n;
      - script.execute: fetch_layout

  - id: flash_esito
    # La seconda meta' del feedback. Il velo alla pressione lo disegna LVGL
    # da solo, al dito, senza rete: dice "ho sentito". Questo dice "il Mac ha
    # eseguito" (verde) oppure "non ha risposto" (rosso), e per forza di cose
    # arriva dopo, quando la POST ha una risposta.
    # mode: restart e lo spegnimento di TUTTE le caselle a ogni giro: due
    # tocchi ravvicinati interrompono il primo flash a meta', e senza questo
    # una casella resterebbe accesa per sempre.
    mode: restart
    parameters:
      slot: int
      ok: bool
    then:
      - lambda: |-
          auto &H = id(hit_refs);
          if (H[0] == nullptr)
            H = {id(hit_0), id(hit_1), id(hit_2),  id(hit_3),
                 id(hit_4), id(hit_5), id(hit_6),  id(hit_7),
                 id(hit_8), id(hit_9), id(hit_10), id(hit_11)};
          for (int i = 0; i < 12; i++)
            lv_obj_set_style_bg_opa(H[i], LV_OPA_TRANSP, LV_PART_MAIN);
          if (slot < 0 || slot > 11) return;
          lv_obj_set_style_bg_color(H[slot],
            lv_color_hex(ok ? 0x2FBF5F : 0xE5484D), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(H[slot], 170, LV_PART_MAIN);
      - delay: 300ms
      - lambda: |-
          auto &H = id(hit_refs);
          if (H[0] == nullptr) return;
          for (int i = 0; i < 12; i++)
            lv_obj_set_style_bg_opa(H[i], LV_OPA_TRANSP, LV_PART_MAIN);

  - id: press_slot
    # In CODA, non in parallelo: il componente http_request regge una
    # richiesta alla volta, e due tocchi ravvicinati si facevano fallire a
    # vicenda. Il contatore serve al polling per non sbattere contro la POST
    # del tocco: era quello a far comparire "Mac non raggiungibile" premendo
    # un pulsante.
    mode: queued
    max_runs: 4
    parameters:
      slot: int
    then:
      - lambda: 'id(press_in_corso)++; id(slot_in_volo) = slot;'
      - http_request.post:
          url: !lambda 'return std::string("http://") + id(agent_host_txt).state + ":${agent_port}" + "/press";'
          request_headers:
            X-Deck-Token: !secret deck_token
            Content-Type: application/json
          json: |-
            root["page"] = id(current_page);
            root["slot"] = slot;
          on_response:
            then:
              - script.execute:
                  id: flash_esito
                  slot: !lambda 'return id(slot_in_volo);'
                  ok: !lambda 'return response->status_code == 200;'
          on_error:
            then:
              - script.execute:
                  id: flash_esito
                  slot: !lambda 'return id(slot_in_volo);'
                  ok: false
      - lambda: 'if (id(press_in_corso) > 0) id(press_in_corso)--;' 

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              // Un tocco in volo ha la precedenza: lo stato puo' aspettare.
              if (id(press_in_corso) != 0) return false;
              // Mac assente (deck portato fuori casa, o Mac chiuso): si
              // passa da un tentativo ogni 2 s a uno ogni 14. Ogni tentativo
              // a vuoto costa un blocco del loop lungo quanto il timeout,
              // e insistere renderebbe il display legnoso proprio quando
              // non serve a niente. Al ritorno del Mac si riparte da soli.
              if (!id(agent_online)) return (++id(giri_a_vuoto) % 7) == 0;
              return true;
          then:
            - script.execute: fetch_state

# ------------------------------------------------------------------- LVGL

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  # Rotazione SOFTWARE: il driver non ha quella hardware. Ruota anche il touch.
  rotation: 90
  bg_color: 0x12141A
  # Nessuno spegnimento per inattivita': il display sta su una scrivania,
  # alimentato dal cavo, e serve che le icone si vedano sempre. Senza cavo
  # non c'e' batteria e quindi non c'e' niente da risparmiare. La
  # retroilluminazione resta comunque un'entita' controllabile ("backlight"),
  # quindi si puo' sempre spegnere a comando se un giorno serve.
  top_layer:
    widgets:
      # Nessuna fascia fissa: volume, brano e CPU erano decorazione e
      # costavano 36 px permanenti. Resta solo cio' che serve sapere quando
      # qualcosa non va, e occupa spazio soltanto in quel caso.
      - obj:
          id: avviso
          x: 60
          y: 125
          width: 360
          height: 70
          bg_color: 0x3A1A1A
          bg_opa: COVER
          radius: 12
          border_width: 2
          border_color: 0xFF6B6B
          pad_all: 8
          hidden: true
          widgets:
            - label:
                id: avviso_testo
                x: 0
                y: 0
                width: 344
                text: ""
                align: CENTER
                long_mode: WRAP
                text_align: CENTER
                text_color: 0xFFC9C9
                text_font: font_hdr
  pages:
    - id: deck_page
      widgets:
        # L'intera schermata, disegnata dal Mac.
        - image:
            id: screen_obj
            src: screen_img
            x: 0
            y: 0
            width: 480
            height: 320
        # Dodici aree di tocco trasparenti: posizione e visibilita' le decide
        # il Mac via /layout. Il bordo compare quando la chiave di stato e' vera.
        - obj:
            id: hit_0
            x: 4
            y: 4
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 0
        - obj:
            id: hit_1
            x: 162
            y: 4
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 1
        - obj:
            id: hit_2
            x: 320
            y: 4
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 2
        - obj:
            id: hit_3
            x: 4
            y: 109
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 3
        - obj:
            id: hit_4
            x: 162
            y: 109
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 4
        - obj:
            id: hit_5
            x: 320
            y: 109
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            pressed:
              bg_opa: 25%
              bg_color: 0xFFFFFF
              border_width: 2
              border_color: 0xFFFFFF
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 5
        - obj:
            id: hit_6
            x: 4
            y: 214
            width: 154
            height: 101
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
