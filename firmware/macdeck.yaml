            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 6
        - obj:
            id: hit_7
            x: 361
