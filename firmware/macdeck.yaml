font:
  - file: "gfonts://Roboto"
    id: font_hdr
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_nav
    size: 13
    glyphsets: [GF_Latin_Core]

# ---------------------------------------------------------------- script

script:
  - id: fetch_layout
    mode: restart
    then:
      - http_request.get:
          url: !lambda |-
            return "http://${agent_host}:${agent_port}/layout?page=" +
                   to_string(id(current_page));
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("macdeck", "/layout ha risposto %d",
                             response->status_code);
                    return;
                  }
                  lv_obj_t *imgs[12] = {
                    id(tile_img_0), id(tile_img_1), id(tile_img_2), id(tile_img_3),
                    id(tile_img_4), id(tile_img_5), id(tile_img_6), id(tile_img_7),
                    id(tile_img_8), id(tile_img_9), id(tile_img_10), id(tile_img_11)};
                  esphome::online_image::OnlineImage *tiles[12] = {
                    id(tile_0), id(tile_1), id(tile_2), id(tile_3),
                    id(tile_4), id(tile_5), id(tile_6), id(tile_7),
                    id(tile_8), id(tile_9), id(tile_10), id(tile_11)};
                  bool used[12] = {false};
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    id(layout_version) = root["version"] | -1;
                    id(page_count) = root["pages"].size();
                    for (JsonObject s : root["slots"].as<JsonArray>()) {
                      int i = s["i"] | -1;
                      if (i < 0 || i > 11) continue;
                      lv_obj_set_pos(imgs[i], s["x"] | 0, s["y"] | 0);
                      lv_obj_set_size(imgs[i], s["w"] | 0, s["h"] | 0);
                      lv_obj_clear_flag(imgs[i], LV_OBJ_FLAG_HIDDEN);
                      std::string path = s["url"] | "";
                      tiles[i]->set_url(
                        "http://${agent_host}:${agent_port}" + path);
                      tiles[i]->update();
                      id(state_keys)[i] = std::string(s["state"] | "");
                      used[i] = true;
                    }
                    return true;
                  });
                  for (int i = 0; i < 12; i++) {
                    if (!used[i]) {
                      lv_obj_add_flag(imgs[i], LV_OBJ_FLAG_HIDDEN);
                      id(state_keys)[i] = "";
                    }
                  }
      - lvgl.label.update:
          id: nav_label
          text: !lambda |-
            return "Pagina " + to_string(id(current_page) + 1) + "/" +
                   to_string(id(page_count));

  - id: fetch_state
    mode: restart
    then:
      - http_request.get:
          url: "http://${agent_host}:${agent_port}/state"
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  id(fail_streak) = 0;
                  id(agent_online) = true;
                  lv_obj_t *imgs[12] = {
                    id(tile_img_0), id(tile_img_1), id(tile_img_2), id(tile_img_3),
                    id(tile_img_4), id(tile_img_5), id(tile_img_6), id(tile_img_7),
                    id(tile_img_8), id(tile_img_9), id(tile_img_10), id(tile_img_11)};
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    char buf[96];

                    int vol = root["volume"]["level"] | -1;
                    bool muted = root["volume"]["muted"] | false;
                    if (vol < 0)    snprintf(buf, sizeof(buf), "--");
                    else if (muted) snprintf(buf, sizeof(buf), "muto");
                    else            snprintf(buf, sizeof(buf), "%d%%", vol);
                    lv_label_set_text(id(hdr_volume), buf);

                    const char *title = root["media"]["title"] | "";
                    lv_label_set_text(id(hdr_media), title);

                    float cpu = root["system"]["cpu"] | 0.0f;
                    int bat = root["system"]["battery"] | -1;
                    if (bat >= 0)
                      snprintf(buf, sizeof(buf), "cpu %.0f%%  bat %d%%", cpu, bat);
                    else
                      snprintf(buf, sizeof(buf), "cpu %.0f%%", cpu);
                    lv_label_set_text(id(hdr_system), buf);

                    bool acc = root["accessibility_ok"] | true;
                    lv_label_set_text(id(hdr_warn), acc ? "" : "!");

                    // Bordo di accento sugli slot la cui chiave di stato e'
                    // veritiera. La chiave e' un percorso puntato dentro
                    // questo stesso JSON, quindi non serve nessun round-trip.
                    for (int i = 0; i < 12; i++) {
                      const std::string &key = id(state_keys)[i];
                      bool on = false;
                      if (!key.empty()) {
                        JsonVariantConst cur = root;
                        size_t start = 0;
                        while (true) {
                          size_t dot = key.find('.', start);
                          std::string part = (dot == std::string::npos)
                            ? key.substr(start) : key.substr(start, dot - start);
                          cur = cur[part];
                          if (dot == std::string::npos) break;
                          start = dot + 1;
                        }
                        on = cur.as<bool>();
                      }
                      lv_obj_set_style_border_width(imgs[i], on ? 3 : 0,
                                                    LV_PART_MAIN);
                      lv_obj_set_style_border_color(
                        imgs[i], lv_color_hex(0x4A9EFF), LV_PART_MAIN);
                    }

                    // Il canale che serve per volume e brano trasporta anche
                    // l'invalidazione della cache: nessun push da progettare.
                    int v = root["layout_version"] | -1;
                    if (v != id(layout_version)) {
                      id(layout_version) = v;
                      id(fetch_layout).execute();
                    }
                    return true;
                  });
          on_error:
            then:
              - lambda: |-
                  id(fail_streak)++;
                  if (id(fail_streak) >= 3) id(agent_online) = false;
      - lvgl.label.update:
          id: hdr_offline
          # std::string esplicito: il ternario fra due letterali darebbe
          # const char*, e ESPHome ci chiama .c_str() sopra.
          text: !lambda |-
            return std::string(id(agent_online) ? "" : "Mac non raggiungibile");

  - id: change_page
    mode: single
    parameters:
      delta: int
    then:
      - lambda: |-
          int n = id(page_count);
          if (n <= 0) n = 1;
          id(current_page) = ((id(current_page) + delta) % n + n) % n;
      - script.execute: fetch_layout

  - id: press_slot
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
    then:
      - http_request.post:
          url: "http://${agent_host}:${agent_port}/press"
          request_headers:
            X-Deck-Token: !secret deck_token
            Content-Type: application/json
          json: |-
            root["page"] = id(current_page);
            root["slot"] = slot;

interval:
  - interval: 2s
    then:
      - script.execute: fetch_state

# ------------------------------------------------------------------- LVGL

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  bg_color: 0x12141A
  on_idle:
    timeout: 5min
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 320
          height: 36
          bg_color: 0x12141A
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          radius: 0
          widgets:
            - label:
                id: hdr_volume
                x: 6
                y: 10
                text: "--"
                text_color: 0xE8EAF0
                text_font: font_hdr
            - label:
                id: hdr_media
                x: 52
                y: 10
                width: 160
                text: ""
                text_color: 0x9AA3B2
                text_font: font_hdr
                long_mode: DOT
            - label:
                id: hdr_system
                x: 216
                y: 10
                text: ""
                text_color: 0x9AA3B2
                text_font: font_hdr
            - label:
                id: hdr_warn
                x: 306
                y: 10
                text: ""
                text_color: 0xFFAA3C
                text_font: font_hdr
            - label:
                id: hdr_offline
                x: 0
                y: 10
                width: 320
                text: ""
                align: CENTER
                text_color: 0xFF6B6B
                text_font: font_hdr
  pages:
    - id: deck_page
      widgets:
        - image:
            id: tile_img_0
            src: tile_0
            x: 4
            y: 40
            width: 101
            height: 99
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 0
        - image:
            id: tile_img_1
            src: tile_1
            x: 109
            y: 40
            width: 101
            height: 99
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 1
        - image:
            id: tile_img_2
            src: tile_2
