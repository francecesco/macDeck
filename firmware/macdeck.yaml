# MacDeck — Guition JC3248W535 (ESP32-S3, 3.5" 320x480, AXS15231B QSPI)
#
# Il firmware e' un renderer muto: non conosce ne' app ne' icone ne' la
# griglia. Riceve da /layout la posizione, la dimensione e l'URL di ogni
# tile, e al tocco manda {page, slot} a /press.
#
# La geometria si applica chiamando l'API C di LVGL da lambda: x, y, width e
# height sono proprieta' di stile aggiornabili, ma non e' garantito che
# accettino !lambda, mentre lv_obj_set_pos/lv_obj_set_size funzionano sempre.
#
# ORIENTAMENTO: 320x480 VERTICALE. L'AXS15231B non supporta lo scambio degli
# assi (swap_xy e' UNDEFINED nel preset di ESPHome, che rifiuta il transform
# in fase di validazione), quindi il landscape non e' ottenibile. La griglia
# di default e' 3x4, che in verticale da' tile quasi quadrate da 101x99.

substitutions:
  name: macdeck
  agent_host: "nome-del-mac.local"
  agent_port: "8765"

esphome:
  name: ${name}
  friendly_name: MacDeck
  min_version: 2026.5.0
  on_boot:
    - priority: -100
      then:
        - delay: 3s
        - script.execute: fetch_layout

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Fa risolvere i nomi .local dal resolver standard: e' cio' che
      # permette di chiamare il Mac per nome Bonjour invece che per IP.
      CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES: "y"

psram:
  mode: octal
  # 80 MHz e non 120: la plancia ha insegnato che l'instabilita' della PSRAM
  # si manifesta come rollback OTA silenzioso, pessimo da diagnosticare.
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MacDeck Fallback"

captive_portal:

mdns:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

json:

# ---------------------------------------------------------------- display

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: mipi_spi
    model: JC3248W535
    id: main_display
    spi_id: display_qspi
    dimensions:
      width: 320
      height: 480
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: 1
    id: backlight_out

light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Retroilluminazione"
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

i2c:
  - id: touch_bus
    sda: 4
    scl: 8

touchscreen:
  - platform: axs15231
    id: main_touch
    i2c_id: touch_bus
    display: main_display
    on_touch:
      # Il primo tocco a schermo spento riaccende e NON attiva il pulsante
      # sotto: LVGL e' in pausa, quindi non riceve l'evento.
      - if:
          condition:
            lambda: 'return !id(backlight).current_values.is_on();'
          then:
            - light.turn_on: backlight
            - lvgl.resume:

# ------------------------------------------------------------------- rete

http_request:
  id: http
  timeout: 4s
  verify_ssl: false

globals:
  - id: layout_version
    type: int
    restore_value: false
    initial_value: "-1"
  - id: current_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_count
    type: int
    restore_value: false
    initial_value: "1"
  - id: agent_online
    type: bool
    restore_value: false
    initial_value: "false"
  - id: fail_streak
    type: int
    restore_value: false
    initial_value: "0"
  - id: state_keys
    type: std::array<std::string, 12>
    restore_value: false

