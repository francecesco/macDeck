            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 11
        # Navigazione: trasparenti, la grafica la disegna il Mac nell'immagine.
        - obj:
            id: nav_prev
