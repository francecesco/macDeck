# MacDeck — Guition JC3248W535 (ESP32-S3, AXS15231B QSPI)
#
# Il firmware e' un renderer muto. Scarica UNA immagine a schermo intero dal
# Mac e ci sovrappone dodici rettangoli trasparenti che raccolgono i tocchi.
# Non conosce ne' app, ne' icone, ne' la griglia.
#
# PERCHE' UNA SOLA IMMAGINE. La prima versione aveva dodici online_image, una
# per tile, e sul dispositivo ha prodotto due guasti distinti:
#   - "Failed to create socket ... Failed to open a new connection: 32770":
#     ESP-IDF ha 10 socket, dodici download paralleli li esauriscono e le
#     ultime quattro tile non arrivavano mai;
#   - ogni widget immagine andava re-invalidato singolarmente dopo il
#     download, e lo schermo restava nero anche per le tile scaricate.
# Una immagine sola elimina entrambi per costruzione: un socket, un refresh.
#
# ORIENTAMENTO. Il pannello e' 320x480 e l'AXS15231B non supporta lo scambio
# degli assi: `transform: swap_xy` sul display viene rifiutato in validazione.
# Il landscape si ottiene con la rotazione SOFTWARE di LVGL, che ruota anche
# le coordinate del touch perche' il touchscreen e' registrato dentro LVGL.
# Lo spazio utile diventa 480x320.

substitutions:
  name: macdeck
  # IP e non il nome Bonjour: nome-del-mac.local annuncia SEI
  # indirizzi, fra cui 127.0.0.1 e tre IPv6 di loopback/link-local. Quando
  # l'ESP ne pesca uno sbagliato si collega a se stesso e resta bloccato
  # fino al timeout, bloccando il loop principale e facendo scattare il
  # watchdog. Richiede la riserva DHCP sul router per questo MAC.
  agent_host: "192.168.1.28"
  agent_port: "8765"

esphome:
  name: ${name}
  friendly_name: MacDeck
  min_version: 2026.5.0
  on_boot:
    - priority: -100
      then:
        - delay: 3s
        - script.execute: fetch_layout

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Lasciato attivo per comodita' di diagnosi, ma NON ci si appoggia:
      # vedi il commento su agent_host.
      CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MacDeck Fallback"

captive_portal:

mdns:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

json:

# ---------------------------------------------------------------- display

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: mipi_spi
    model: JC3248W535
    id: main_display
    spi_id: display_qspi
    dimensions:
      width: 320
      height: 480
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    pin: 1
    id: backlight_out

light:
  - platform: monochromatic
    output: backlight_out
    id: backlight
    name: "Retroilluminazione"
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

i2c:
  - id: touch_bus
    sda: 4
    scl: 8

touchscreen:
  - platform: axs15231
    id: main_touch
    i2c_id: touch_bus
    display: main_display
    on_touch:
      # Il primo tocco a schermo spento riaccende e NON preme nulla: LVGL e'
      # in pausa, quindi l'evento non raggiunge nessun widget.
      - if:
          condition:
            lambda: 'return !id(backlight).current_values.is_on();'
          then:
            - light.turn_on: backlight
            - lvgl.resume:

# ------------------------------------------------------------------- rete

http_request:
  id: http
  timeout: 8s
  verify_ssl: false

globals:
  - id: layout_version
    type: int
    restore_value: false
    initial_value: "-1"
  - id: current_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_count
    type: int
    restore_value: false
    initial_value: "1"
  - id: agent_online
    type: bool
    restore_value: false
    initial_value: "false"
  - id: fail_streak
    type: int
    restore_value: false
    initial_value: "0"
  - id: state_keys
    type: std::array<std::string, 12>
    restore_value: false

online_image:
  - id: screen_img
    url: "http://${agent_host}:${agent_port}/screen/0.png"
    format: PNG
    type: RGB565
    buffer_size: 65536
    request_headers:
      X-Deck-Token: !secret deck_token
    on_download_finished:
      then:
        # Ri-assegnare src, non solo invalidare: dopo il download il
        # descrittore dell'immagine e' cambiato e LVGL deve rileggerlo.
        - lvgl.image.update:
            id: screen_obj
            src: screen_img
    on_error:
      then:
        - logger.log: "download della schermata fallito"

font:
  - file: "gfonts://Roboto"
    id: font_hdr
    size: 15
    glyphsets: [GF_Latin_Core]

# ---------------------------------------------------------------- script

script:
  - id: fetch_layout
    mode: restart
    then:
      - http_request.get:
          url: !lambda |-
            return "http://${agent_host}:${agent_port}/layout?page=" +
                   to_string(id(current_page));
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("macdeck", "/layout ha risposto %d, torno alla "
                             "pagina 0", response->status_code);
                    id(current_page) = 0;
                    return;
                  }
                  lv_obj_t *hits[12] = {
                    id(hit_0), id(hit_1), id(hit_2), id(hit_3),
                    id(hit_4), id(hit_5), id(hit_6), id(hit_7),
                    id(hit_8), id(hit_9), id(hit_10), id(hit_11)};
                  bool used[12] = {false};
                  std::string screen_url;
                  bool nav = true;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    id(layout_version) = root["version"] | -1;
                    id(page_count) = root["pages"].size();
                    nav = root["nav"] | true;
                    // Autoritativa: il server puo' aver riportato l'indice
                    // dentro l'intervallo se la pagina corrente e' sparita.
                    id(current_page) = root["page"] | 0;
                    screen_url = std::string(root["screen"] | "");
                    for (JsonObject s : root["slots"].as<JsonArray>()) {
                      int i = s["i"] | -1;
                      if (i < 0 || i > 11) continue;
                      lv_obj_set_pos(hits[i], s["x"] | 0, s["y"] | 0);
                      lv_obj_set_size(hits[i], s["w"] | 0, s["h"] | 0);
                      lv_obj_clear_flag(hits[i], LV_OBJ_FLAG_HIDDEN);
                      id(state_keys)[i] = std::string(s["state"] | "");
                      used[i] = true;
                    }
                    return true;
                  });
                  for (int i = 0; i < 12; i++) {
                    if (!used[i]) {
                      lv_obj_add_flag(hits[i], LV_OBJ_FLAG_HIDDEN);
                      id(state_keys)[i] = "";
                    }
                  }
                  // Con una pagina sola le frecce non servono, e i 28 px
                  // della barra sono gia' stati dati alle tile dal Mac.
                  for (lv_obj_t *b : {id(nav_prev), id(nav_next)}) {
                    if (nav) lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
                    else     lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
                  }
                  if (!screen_url.empty()) {
                    id(screen_img)->set_url(
                      "http://${agent_host}:${agent_port}" + screen_url);
                    id(screen_img)->update();
                  }

  - id: fetch_state
    mode: restart
    then:
      - http_request.get:
          url: "http://${agent_host}:${agent_port}/state"
          request_headers:
            X-Deck-Token: !secret deck_token
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  id(fail_streak) = 0;
                  id(agent_online) = true;
                  lv_obj_t *hits[12] = {
                    id(hit_0), id(hit_1), id(hit_2), id(hit_3),
                    id(hit_4), id(hit_5), id(hit_6), id(hit_7),
                    id(hit_8), id(hit_9), id(hit_10), id(hit_11)};
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    char buf[96];

                    int vol = root["volume"]["level"] | -1;
                    bool muted = root["volume"]["muted"] | false;
                    if (vol < 0)    snprintf(buf, sizeof(buf), "--");
                    else if (muted) snprintf(buf, sizeof(buf), "muto");
                    else            snprintf(buf, sizeof(buf), "%d%%", vol);
                    lv_label_set_text(id(hdr_volume), buf);

                    const char *title = root["media"]["title"] | "";
                    lv_label_set_text(id(hdr_media), title);

                    float cpu = root["system"]["cpu"] | 0.0f;
                    int bat = root["system"]["battery"] | -1;
                    if (bat >= 0)
                      snprintf(buf, sizeof(buf), "cpu %.0f%%  bat %d%%", cpu, bat);
                    else
                      snprintf(buf, sizeof(buf), "cpu %.0f%%", cpu);
                    lv_label_set_text(id(hdr_system), buf);

                    bool acc = root["accessibility_ok"] | true;
                    lv_label_set_text(id(hdr_warn), acc ? "" : "!");

                    // Bordo di accento sugli slot la cui chiave di stato e'
                    // veritiera: le aree di tocco sono trasparenti, quindi il
                    // bordo e' l'unica cosa che disegnano.
                    for (int i = 0; i < 12; i++) {
                      const std::string &key = id(state_keys)[i];
                      bool on = false;
                      if (!key.empty()) {
                        JsonVariantConst cur = root;
                        size_t start = 0;
                        while (true) {
                          size_t dot = key.find('.', start);
                          std::string part = (dot == std::string::npos)
                            ? key.substr(start) : key.substr(start, dot - start);
                          cur = cur[part];
                          if (dot == std::string::npos) break;
                          start = dot + 1;
                        }
                        on = cur.as<bool>();
                      }
                      lv_obj_set_style_border_width(hits[i], on ? 3 : 0,
                                                    LV_PART_MAIN);
                    }

                    // Il canale che serve per volume e brano trasporta anche
                    // l'invalidazione della cache: nessun push da progettare.
                    //
                    // NON si aggiorna qui id(layout_version): la versione va
                    // registrata solo quando fetch_layout e' RIUSCITO. Averla
                    // registrata prima significava che un solo fallimento
                    // (es. la pagina corrente sparita, 404) cristallizzava il
                    // display su un layout vecchio per sempre.
                    int v = root["layout_version"] | -1;
                    if (v != id(layout_version)) {
                      id(fetch_layout).execute();
                    }
                    return true;
                  });
          on_error:
            then:
              - lambda: |-
                  id(fail_streak)++;
                  if (id(fail_streak) >= 3) id(agent_online) = false;
      - lvgl.label.update:
          id: hdr_offline
          text: !lambda |-
            return std::string(id(agent_online) ? "" : "Mac non raggiungibile");

  - id: change_page
    mode: single
    parameters:
      delta: int
    then:
      - lambda: |-
          int n = id(page_count);
          if (n <= 0) n = 1;
          id(current_page) = ((id(current_page) + delta) % n + n) % n;
      - script.execute: fetch_layout

  - id: press_slot
    mode: parallel
    max_runs: 4
    parameters:
      slot: int
    then:
      - http_request.post:
          url: "http://${agent_host}:${agent_port}/press"
          request_headers:
            X-Deck-Token: !secret deck_token
            Content-Type: application/json
          json: |-
            root["page"] = id(current_page);
            root["slot"] = slot;

interval:
  - interval: 2s
    then:
      - script.execute: fetch_state

# ------------------------------------------------------------------- LVGL

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  # Rotazione SOFTWARE: il driver non ha quella hardware. Ruota anche il touch.
  rotation: 90
  bg_color: 0x12141A
  on_idle:
    timeout: 5min
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 480
          height: 36
          bg_color: 0x12141A
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          radius: 0
          widgets:
            - label:
                id: hdr_volume
                x: 8
                y: 10
                text: "--"
                text_color: 0xE8EAF0
                text_font: font_hdr
            - label:
                id: hdr_media
                x: 70
                y: 10
                width: 200
                text: ""
                text_color: 0x9AA3B2
                text_font: font_hdr
                long_mode: DOT
            - label:
                id: hdr_system
                x: 290
                y: 10
                text: ""
                text_color: 0x9AA3B2
                text_font: font_hdr
            - label:
                id: hdr_warn
                x: 462
                y: 10
                text: ""
                text_color: 0xFFAA3C
                text_font: font_hdr
            - label:
                id: hdr_offline
                x: 0
                y: 10
                width: 480
                text: ""
                align: CENTER
                text_color: 0xFF6B6B
                text_font: font_hdr
  pages:
    - id: deck_page
      widgets:
        # L'intera schermata, disegnata dal Mac.
        - image:
            id: screen_obj
            src: screen_img
            x: 0
            y: 0
            width: 480
            height: 320
        # Dodici aree di tocco trasparenti: posizione e visibilita' le decide
        # il Mac via /layout. Il bordo compare quando la chiave di stato e' vera.
        - obj:
            id: hit_0
            x: 4
            y: 40
            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 0
        - obj:
            id: hit_1
            x: 123
            y: 40
            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 1
        - obj:
            id: hit_2
            x: 242
            y: 40
            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 2
        - obj:
            id: hit_3
            x: 361
            y: 40
            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 3
        - obj:
            id: hit_4
            x: 4
            y: 124
            width: 115
            height: 80
            radius: 10
            bg_opa: TRANSP
            border_width: 0
            border_color: 0x4A9EFF
            pad_all: 0
            clickable: true
            on_click:
              then:
                - script.execute:
                    id: press_slot
                    slot: 4
        - obj:
            id: hit_5
            x: 123
