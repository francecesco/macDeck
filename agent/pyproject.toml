[project]
name = "macdeck"
version = "0.1.0"
description = "Stream Deck per macOS su display ESP32-S3"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.50",
    "pyyaml>=6.0",
    "pillow>=12.0",
    "psutil>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[project.scripts]
macdeck = "macdeck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
